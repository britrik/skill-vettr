name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request != null && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.ts' '*.tsx' '*.js' '*.css' '*.json' '*.yml' '*.yaml' '*.md' \
            ':!package-lock.json' ':!dist/**' ':!*.min.js' \
            | head -c 40000 > pr.diff

      - name: Post AI review
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request
          diff = open('pr.diff').read().strip() if os.path.exists('pr.diff') else ''
          if not diff:
              print('No reviewable diff - skipping AI review.'); sys.exit(0)
          key = os.environ.get('GLM_API_KEY', '').strip()
          if not key:
              print('GLM_API_KEY secret not set - skipping AI review.'); sys.exit(0)
          prompt = (
              "You are reviewing a PR. Focus on:\n"
              "1. PRIVACY - Does any code send user content to an external URL?\n"
              "2. SECURITY - Unsanitized HTML? XSS risk? Input validation?\n"
              "3. CORRECTNESS - Logic bugs, TypeScript errors, unhandled edge cases?\n"
              "4. TESTS - New logic without tests?\n"
              "5. NOTES - Anything else worth mentioning\n\n"
              "Ignore: whitespace, style, lock files, generated files.\n\n"
              f"PR: {os.environ['PR_TITLE']}\n\n```diff\n{diff[:36000]}\n```\n\n"
              "Reply in exactly this format:\n"
              "## AI Review\n### Summary\n[1-2 sentences]\n"
              "### Findings\n[Bullet list. Omit if nothing to flag.]\n"
              "### Verdict\n[Exactly one of: Looks good | Minor issues, author's call | Needs changes]"
          )
          import urllib.request as u
          req = u.Request('https://api.z.ai/api/coding/paas/v4/chat/completions',
              data=json.dumps({'model': 'glm-5-turbo', 'messages': [{'role': 'user', 'content': prompt}],
                               'max_tokens': 4096, 'temperature': 0.2}).encode(),
              headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'})
          try:
              with u.urlopen(req, timeout=180) as resp:
                  data = json.loads(resp.read())
          except Exception as e:
              print(f'GLM API error: {e}'); sys.exit(0)
          choices = data.get('choices') or []
          review = (((choices[0].get('message') or {}).get('content')) or '').strip() if choices else ''
          if not review:
              print('GLM returned empty content - skipping comment.'); sys.exit(0)
          subprocess.run(['gh', 'pr', 'comment', os.environ['PR_NUMBER'], '--body', review], check=True, timeout=60)
          PY
